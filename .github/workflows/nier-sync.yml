name: NIER Hourly Water Quality Sync

on:
  schedule:
    # 매시간 10분에 트리거 (이후 스텝에서 0~300초 랜덤 슬립하여 10분~15분 사이에 1회 수집)
    - cron: "10 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Random jitter sleep (0 to 300s -> 10m to 15m window)
        if: github.event_name == 'schedule'
        run: |
          SLEEP_SEC=$((RANDOM % 301))
          echo "Sleeping for ${SLEEP_SEC}s to randomize request time between :10 and :15..."
          sleep $SLEEP_SEC

      - name: Sync NIER 1-call snapshot to Supabase 48h rolling cache
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          node -e '
          const SUPABASE_URL = process.env.SUPABASE_URL || "https://ymtjoyootbkszgmjywzb.supabase.co";
          const SUPABASE_KEY = process.env.SUPABASE_KEY;
          const CACHE_BUCKET = "items";
          const CACHE_OBJECT_PATH = "_cache/nier_48h_cache.json";
          const CODES = new Set(["S01001","S01011","S01003","S01004","S01020","S01018","S01021","S01016","S01022","S01010","S01013","S01025","S01005","S01006","S01012","S01015","S01023","S01014","S01007","S01017","S01009","S01019","S01002"]);
          const METRICS = ["wqi","wtrtp","ph","doc","ec","tur","toc","tn","tp","chla"];

          async function run() {
            const kst = new Date(Date.now() + 9*3600*1000 - 12*60*1000);
            const pad = (n) => String(n).padStart(2, "0");
            const hourKey = `${kst.getUTCFullYear()}-${pad(kst.getUTCMonth()+1)}-${pad(kst.getUTCDate())}-${pad(kst.getUTCHours())}`;
            const kstYest = new Date(Date.now() + 9*3600*1000 - 24*3600*1000);
            const yestPrefix = `${kstYest.getUTCFullYear()}-${pad(kstYest.getUTCMonth()+1)}-${pad(kstYest.getUTCDate())}`;

            let existing = { stations: {}, prevAvgByCode: {} };
            try {
              const r = await fetch(`${SUPABASE_URL}/storage/v1/object/public/${CACHE_BUCKET}/${CACHE_OBJECT_PATH}?t=${Date.now()}`);
              if (r.ok) existing = await r.json();
            } catch {}

            const nierRes = await fetch("https://water.nier.go.kr/web/autoWaterData/listJson", {
              method: "POST",
              headers: {
                "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36",
                "Referer": "https://water.nier.go.kr/web",
                "X-Requested-With": "XMLHttpRequest",
                "Content-Type": "application/x-www-form-urlencoded; charset=UTF-8"
              },
              body: "a=1"
            });
            const nierJson = await nierRes.json();
            const list = nierJson.atoWaterData || [];
            const parseVal = (v) => (v === null || v === undefined || v === "" || Number.isNaN(Number(v))) ? null : Number(v);

            const stations = existing.stations || {};
            const prevAvgByCode = existing.prevAvgByCode || {};

            for (const item of list) {
              const code = item.WQAMN_CODE;
              if (!CODES.has(code)) continue;
              const raw = String(item.MESURE_DT || "");
              const measureDt = raw.length >= 10
                ? `${raw.slice(0,4)}-${raw.slice(4,6)}-${raw.slice(6,8)} ${raw.slice(8,10)}h`
                : (item.MSR_DATE_FMT || "");

              const rec = {
                stationCode: code,
                stationName: item.WQAMN_NM || "",
                measureDt,
                grade: item.WQI_GRD_NM || null,
                wqi: parseVal(item.WQI),
                wtrtp: parseVal(item.STTUS_WTRTP),
                ph: parseVal(item.STTUS_PH),
                ec: parseVal(item.STTUS_EC),
                doc: parseVal(item.STTUS_DOC),
                toc: parseVal(item.STTUS_TOC),
                tn: parseVal(item.STTUS_TN),
                tp: parseVal(item.STTUS_TP),
                tur: parseVal(item.STTUS_TUR),
                chla: parseVal(item.STTUS_CHLA)
              };

              const arr = Array.isArray(stations[code]) ? [...stations[code]] : [];
              if (arr.length > 0 && arr[arr.length - 1].measureDt === rec.measureDt) {
                arr[arr.length - 1] = rec;
              } else {
                arr.push(rec);
              }
              arr.sort((a, b) => a.measureDt.localeCompare(b.measureDt));
              const trimmed = arr.slice(-48);
              stations[code] = trimmed;

              let targets = trimmed.filter(r => r.measureDt?.startsWith(yestPrefix));
              if (targets.length === 0) targets = trimmed.length > 1 ? trimmed.slice(0, -1) : trimmed;
              const avg = {};
              for (const k of METRICS) {
                const nums = targets.map(r => r[k]).filter(v => typeof v === "number" && !Number.isNaN(v));
                avg[k] = nums.length > 0 ? Number((nums.reduce((a,b)=>a+b,0)/nums.length).toFixed(4)) : null;
              }
              prevAvgByCode[code] = avg;
            }

            const payload = {
              lastHourKey: hourKey,
              updatedAt: new Date().toISOString(),
              stations,
              prevAvgByCode
            };

            if (SUPABASE_KEY) {
              const up = await fetch(`${SUPABASE_URL}/storage/v1/object/${CACHE_BUCKET}/${CACHE_OBJECT_PATH}`, {
                method: "POST",
                headers: {
                  apikey: SUPABASE_KEY,
                  Authorization: `Bearer ${SUPABASE_KEY}`,
                  "Content-Type": "application/json",
                  "x-upsert": "true"
                },
                body: JSON.stringify(payload)
              });
              console.log("Uploaded 48h rolling cache:", up.status);
            }
          }
          run().catch(e => { console.error(e); process.exit(1); });
          '
